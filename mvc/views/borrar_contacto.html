$def with (contacto)

$if contacto:
    <h2>¿Seguro que deseas eliminar este contacto?</h2>
    <form method="POST" action="/borrar_contacto">
        <input type="hidden" name="id" value="$contacto['id']">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" value="$contacto['nombre']" readonly><br>

        <label for="email">Email</label>
        <input type="email" id="email" value="$contacto['email']" readonly><br>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" value="$contacto['telefono']" readonly><br>

        <button type="submit">Confirmar Borrar</button>
        <a href="/contactos">Cancelar</a>
    </form>
$else:
    <h2>Contacto no encontrado</h2>
    <a href="/contactos">Regresar</a>
