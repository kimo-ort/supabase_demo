$def with (contacto)

$if contacto:
    <h2>Actualizar contacto</h2>
    <form method="POST" action="/actualizar_contacto">
        <input type="hidden" name="id" value="$contacto['id']">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="$contacto['nombre']" required><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="$contacto['email']" required><br>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" value="$contacto['telefono']" required><br>

        <button type="submit">Guardar cambios</button>
        <a href="/contactos">Cancelar</a>
    </form>
$else:
    <h2>Contacto no encontrado</h2>
    <a href="/contactos">Regresar</a>
